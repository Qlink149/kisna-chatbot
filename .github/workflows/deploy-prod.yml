name: Deploy prod

"on":
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: blr.vultrcr.com/qlink01/kisna-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # python-version must stay in sync with ARG PYTHON_VERSION in the Dockerfile.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Vultr registry
        uses: docker/login-action@v3
        with:
          registry: blr.vultrcr.com
          username: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          password: ${{ secrets.VULTR_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to droplet
        id: deploy
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: IMAGE
          script: |
            set -eu
            PREV_FILE=/opt/kisna/.previous-image
            mkdir -p /opt/kisna
            if docker inspect kisna-backend >/dev/null 2>&1; then
              docker inspect -f '{{.Config.Image}}' kisna-backend > "$PREV_FILE"
            else
              : > "$PREV_FILE"
            fi
            docker pull "$IMAGE"
            docker stop kisna-backend || true
            docker rm kisna-backend || true
            docker run -d --name kisna-backend --restart unless-stopped \
              -p 127.0.0.1:8000:8000 --env-file /opt/kisna/.env \
              "$IMAGE"
            ok=0
            i=0
            while [ "$i" -lt 15 ]; do
              i=$((i + 1))
              if curl -sf http://127.0.0.1:8000/ping | grep -q '"status"'; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              docker logs kisna-backend --tail 50 || true
              exit 1
            fi

      - name: Rollback previous image
        if: failure() && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -eu
            PREV_FILE=/opt/kisna/.previous-image
            if [ ! -s "$PREV_FILE" ]; then
              echo "ROLLBACK FAILED: no previous image recorded at $PREV_FILE"
              exit 1
            fi
            PREV=$(cat "$PREV_FILE")
            if [ -z "$PREV" ]; then
              echo "ROLLBACK FAILED: previous image file is empty"
              exit 1
            fi
            docker pull "$PREV"
            docker stop kisna-backend || true
            docker rm kisna-backend || true
            docker run -d --name kisna-backend --restart unless-stopped \
              -p 127.0.0.1:8000:8000 --env-file /opt/kisna/.env \
              "$PREV"
            ok=0
            i=0
            while [ "$i" -lt 15 ]; do
              i=$((i + 1))
              if curl -sf http://127.0.0.1:8000/ping | grep -q '"status"'; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              docker logs kisna-backend --tail 50 || true
              echo "ROLLBACK FAILED: previous image did not become healthy"
              exit 1
            fi

      - name: Prune old images
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            docker image prune -f --filter "until=168h"
