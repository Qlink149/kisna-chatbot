name: Deploy prod

"on":
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: blr.vultrcr.com/qlink01/kisna-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # python-version must stay in sync with ARG PYTHON_VERSION in the Dockerfile.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Full history so prune_registry.py can order SHA tags via git log prod.
      # Default fetch-depth: 1 would keep almost every SHA tag (unranked).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Vultr registry
        uses: docker/login-action@v3
        with:
          registry: blr.vultrcr.com
          username: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          password: ${{ secrets.VULTR_REGISTRY_PASSWORD }}

      # Runs BEFORE the push, unconditionally (not gated on this job's own
      # success) -- pruning is what keeps the registry under its storage quota
      # for the push below. Gating it on success() instead created a deadlock:
      # once the registry filled up, "Build and push" failed *before* pruning
      # ran, so the registry stayed full and every subsequent push failed the
      # same way. continue-on-error: true so a prune hiccup (e.g. can't order
      # SHA tags via git log) never blocks the deploy that follows it.
      - name: Prune old registry tags
        continue-on-error: true
        env:
          VULTR_REGISTRY_USERNAME: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          VULTR_REGISTRY_PASSWORD: ${{ secrets.VULTR_REGISTRY_PASSWORD }}
        run: |
          pip install requests
          python scripts/prune_registry.py --keep 5 --execute

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to droplet
        id: deploy
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: IMAGE
          script: |
            set -eu
            PREV_FILE=/opt/kisna/.previous-image
            mkdir -p /opt/kisna
            if docker inspect kisna-backend >/dev/null 2>&1; then
              docker inspect -f '{{.Config.Image}}' kisna-backend > "$PREV_FILE"
            else
              : > "$PREV_FILE"
            fi
            docker pull "$IMAGE"
            # Keep the outgoing container's logs: `docker rm` discards them,
            # which left the window between two deploys unverifiable.
            LOG_DIR=/var/log/kisna
            mkdir -p "$LOG_DIR"
            if docker inspect kisna-backend >/dev/null 2>&1; then
              OLD_SHA=$(docker inspect -f '{{.Config.Image}}' kisna-backend | sed 's/.*://' | cut -c1-12)
              docker logs kisna-backend > "$LOG_DIR/backend-${OLD_SHA}-$(date -u +%Y%m%dT%H%M%SZ).log" 2>&1 || true
              # Keep the 10 most recent dumps.
              ls -1t "$LOG_DIR"/backend-*.log 2>/dev/null | tail -n +11 | xargs -r rm -f
            fi
            docker stop kisna-backend || true
            docker rm kisna-backend || true
            # json-file rotation so a long-lived container's log cannot grow
            # without bound (docker logs still reads across the rotated files).
            docker run -d --name kisna-backend --restart unless-stopped \
              --log-driver json-file --log-opt max-size=50m --log-opt max-file=5 \
              -p 127.0.0.1:8000:8000 --env-file /opt/kisna/.env \
              "$IMAGE"
            ok=0
            i=0
            while [ "$i" -lt 15 ]; do
              i=$((i + 1))
              if curl -sf http://127.0.0.1:8000/ping | grep -q '"status"'; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              docker logs kisna-backend --tail 50 || true
              exit 1
            fi

      - name: Rollback previous image
        if: failure() && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -eu
            PREV_FILE=/opt/kisna/.previous-image
            if [ ! -s "$PREV_FILE" ]; then
              echo "ROLLBACK FAILED: no previous image recorded at $PREV_FILE"
              exit 1
            fi
            PREV=$(cat "$PREV_FILE")
            if [ -z "$PREV" ]; then
              echo "ROLLBACK FAILED: previous image file is empty"
              exit 1
            fi
            docker pull "$PREV"
            # Same log preservation as the deploy step: the failed container's
            # logs are exactly what a rollback investigation needs.
            LOG_DIR=/var/log/kisna
            mkdir -p "$LOG_DIR"
            if docker inspect kisna-backend >/dev/null 2>&1; then
              OLD_SHA=$(docker inspect -f '{{.Config.Image}}' kisna-backend | sed 's/.*://' | cut -c1-12)
              docker logs kisna-backend > "$LOG_DIR/backend-${OLD_SHA}-$(date -u +%Y%m%dT%H%M%SZ)-rolledback.log" 2>&1 || true
              ls -1t "$LOG_DIR"/backend-*.log 2>/dev/null | tail -n +11 | xargs -r rm -f
            fi
            docker stop kisna-backend || true
            docker rm kisna-backend || true
            docker run -d --name kisna-backend --restart unless-stopped \
              --log-driver json-file --log-opt max-size=50m --log-opt max-file=5 \
              -p 127.0.0.1:8000:8000 --env-file /opt/kisna/.env \
              "$PREV"
            ok=0
            i=0
            while [ "$i" -lt 15 ]; do
              i=$((i + 1))
              if curl -sf http://127.0.0.1:8000/ping | grep -q '"status"'; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              docker logs kisna-backend --tail 50 || true
              echo "ROLLBACK FAILED: previous image did not become healthy"
              exit 1
            fi

      # Local droplet disk, not the registry -- low-risk either way, so this
      # runs regardless of whether the deploy above succeeded.
      - name: Prune old images
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            docker image prune -f --filter "until=168h"
