[pytest]
testpaths = tests
markers =
    live: makes real LLM API calls (deselected by default; run with `pytest -m live`)
    no_search_recap: test targets search mechanics behind the confirmation gate, so it runs with KISNA_SEARCH_CONFIRM_ENABLED=false
    dropoff_live_offers: test exercises the drop-off's live making-charge fetch (otherwise stubbed to the client's static block)
addopts = -m "not live"
filterwarnings =
    ignore::DeprecationWarning
